name: Build LCALauncher Matrix

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: win64_msvc2022_64
            cmake_generator: "Visual Studio 17 2022"
            artifact_name: LCALauncher-Windows

          - os: macos-latest
            platform: macos
            arch: clang_64
            cmake_generator: "Ninja"
            artifact_name: LCALauncher-macOS

          - os: ubuntu-22.04
            platform: linux
            arch: gcc_64
            cmake_generator: "Ninja"
            artifact_name: LCALauncher-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # OS System Dependencies
      # -------------------------------------------------------------
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libvulkan-dev

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.platform }}
          target: 'desktop'
          arch: ${{ matrix.arch }}
          cache: true

      # -------------------------------------------------------------
      # Windows Build & Package
      # -------------------------------------------------------------
      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -B build -G "${{ matrix.cmake_generator }}" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake --build build --config Release --parallel

      - name: Package with windeployqt (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\LCALauncher.exe -Destination dist\
          # windeployqt is in Qt's bin directory
          $windeployqt = Join-Path $env:Qt6_DIR "bin\windeployqt.exe"
          & $windeployqt --qmldir qml dist\LCALauncher.exe

      # -------------------------------------------------------------
      # macOS Build & Package
      # -------------------------------------------------------------
      - name: Configure CMake (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake --build build --config Release --parallel

      - name: Package with macdeployqt (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          # Use macdeployqt from installed Qt
          "$Qt6_DIR/bin/macdeployqt" build/LCALauncher.app -qmldir=qml -dmg
          if ls build/*.dmg 1> /dev/null 2>&1; then
            mv build/*.dmg dist/
          else
            cp -r build/LCALauncher.app dist/
          fi

      # -------------------------------------------------------------
      # Linux Build & Package
      # -------------------------------------------------------------
      - name: Configure CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake --build build --config Release --parallel

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp build/lcalauncher dist/
          cp -r qml dist/

      # -------------------------------------------------------------
      # Upload Artifacts
      # -------------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
